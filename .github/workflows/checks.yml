name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # scripts/directory.py writes a commit object even when it only builds.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skills and manifests
        run: python3 scripts/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build the Claude directory branch without pushing
        run: python3 scripts/directory.py

  claude-directory:
    # The Claude plugin directory reads the claude-directory branch; see README.md.
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: claude-directory
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build and push the Claude directory branch
        run: python3 scripts/directory.py --push
